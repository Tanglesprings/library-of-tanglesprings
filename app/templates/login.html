<!DOCTYPE html>
<html lang="{{ current_locale()|replace('_', '-') }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Sign In') }} · Library of Tanglesprings</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/brand/tanglesprings.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            {% include "fragments/library_wordmark.html" %}
            <p class="text-shelf-muted text-sm mt-4">Circulation Desk · Undercroft</p>
        </div>

        <form method="POST" action="/login" class="bg-shelf-card border border-shelf-border rounded-xl p-6 space-y-4">
            {% if error %}
            <div class="bg-shelf-error/10 border border-shelf-error/30 text-shelf-error text-sm rounded-lg px-4 py-2">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label for="username" class="block text-sm font-medium text-shelf-muted mb-1">{{ _('Username') }}</label>
                <input type="text" id="username" name="username" required autofocus
                    class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:outline-hidden focus:border-shelf-accent focus:ring-1 focus:ring-shelf-accent">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-shelf-muted mb-1">{{ _('Password') }}</label>
                <input type="password" id="password" name="password" required
                    class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:outline-hidden focus:border-shelf-accent focus:ring-1 focus:ring-shelf-accent">
            </div>

            <button type="submit"
                class="w-full bg-shelf-accent hover:bg-shelf-accent2 text-white font-medium rounded-lg px-4 py-2 transition-colors">
                {{ _('Sign In') }}
            </button>
        </form>
        {% if google_signin_enabled(request) %}
        <div class="text-center mt-3">
            <a href="/auth/google/start" class="inline-block rounded-lg focus-visible:ring-2 focus-visible:ring-shelf-accent">
                <img src="/static/brand/google-sign-in.png" width="180" height="40" alt="{{ _('Sign in with Google') }}">
            </a>
        </div>
        {% endif %}
        <footer class="library-footer"><a href="/source">Source code</a></footer>
    </div>
</body>
</html>
